<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Auctify{% endblock %}</title>
  {% load static %}
  <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-semibold">
        <a href="{% url 'dashboard' %}">🧿 Auctify</a>
      </h1>
      <nav>
        <a href="{% url 'signin' %}" class="text-blue-600 hover:underline mr-4">Sign In</a>
        <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">Sign Up</a>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 container mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 p-4 text-center text-sm text-gray-600">
    &copy; {{ now|date:"Y" }} Auctify. All rights reserved.
  </footer>

</body>
</html>
