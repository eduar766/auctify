{% extends 'base.html' %}
{% block title %}Create Auction{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-6 text-center">Create Auction</h2>
  <form method="post" enctype="multipart/form-data" class="space-y-4">
  {% csrf_token %}
    {% for field in form %}
    <div>
      <label class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
      <p class="text-red-500 text-xs">{{ field.errors.0 }}</p>
      {% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700">Create</button>
  </form>
</div>
{% endblock %}
