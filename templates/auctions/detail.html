{% extends 'base.html' %}
{% block title %}Auction Detail{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-2">{{ auction.title }}</h2>
  <p class="text-sm text-gray-600">{{ auction.category }}</p>
  <p class="mt-4">{{ auction.description }}</p>
  <p class="mt-4 font-bold text-blue-600 text-xl">${{ auction.start_price }}</p>
  <p class="text-sm text-gray-500 mt-1">Ends: {{ auction.end_time }}</p>
</div>
{% endblock %}
