{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto text-center space-y-6">
  <h2 class="text-3xl font-bold">Welcome to Auctify</h2>
  <p class="text-gray-600">What would you like to do today?</p>

  <div class="flex justify-center gap-4 flex-wrap">
    <a href="{% url 'auction_list' %}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      View Auctions
    </a>
    <a href="{% url 'my_bids' %}" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
      My Bids
    </a>
    <a href="{% url 'auction_create' %}" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Create Auction
    </a>
    <a href="{% url 'signout' %}" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
      Sign Out
    </a>
  </div>
</div>
{% endblock %}
